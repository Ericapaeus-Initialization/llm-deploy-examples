services:
  model-service:
    build: .
    image: local/deepseek-v4.1-flash-sm120:45f538a-tp8
    container_name: deepseek-v4.1-flash
    restart: unless-stopped
    init: true
    ipc: host
    network_mode: host
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ${MODEL_PATH:?Set MODEL_PATH in .env}:/model:ro
      - ${CONFIG_PATH:-./config.yaml}:/root/config.yaml:ro
      - ${CACHE_PATH:-./cache}:/root/.cache
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env}
      SERVER_PORT: ${PORT:-20670}
      CUDA_VISIBLE_DEVICES: 0,1,2,3,4,5,6,7
      DSV41_SOURCE: /model
      OFFLOAD_MODE: nvme
      DSV41_CACHE_GIB: ${DSV41_CACHE_GIB:-128}
      HF_HUB_OFFLINE: "1"
      PYTHONUNBUFFERED: "1"
      MAX_JOBS: "4"
    labels:
      deepseek-v41-autoheal: "true"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1", "2", "3", "4", "5", "6", "7"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$API_KEY\" http://127.0.0.1:$$SERVER_PORT/health >/dev/null"]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 3600s
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "10"
  watchdog:
    image: willfarrell/autoheal:latest
    container_name: deepseek-v4.1-flash-watchdog
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: deepseek-v41-autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
