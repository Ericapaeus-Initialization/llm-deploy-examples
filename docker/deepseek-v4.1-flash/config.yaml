# SGLang flags, NOT vLLM flags. Eight-card adaptation is not GPU-validated here.
model-path: /model
served-model-name: deepseek-v4.1-flash
host: 0.0.0.0
trust-remote-code: true
load-format: safetensors
tp: 8
ep-size: 8
attention-backend: dsv4
moe-runner-backend: flashinfer_mxfp4
mem-fraction-static: 0.90
context-length: 400000
# Equivalent intent to vLLM max-num-seqs=50; this is an admission ceiling.
max-running-requests: 50
chunked-prefill-size: 2048
# Total token-pool cap, NOT per request; 50 x 400K would need 20M tokens.
max-total-tokens: 4200000
# Capture only small decode batches initially; larger batches use eager execution.
cuda-graph-max-bs-decode: 8
min-free-slots-delay: 1
random-seed: 0
speculative-algorithm: DSPARK
speculative-dspark-block-size: 5
enable-decoder-swa-bounded-replay: true
tool-call-parser: deepseekv41
reasoning-parser: deepseek-v41
