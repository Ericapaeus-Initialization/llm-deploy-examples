model: "/model"
served-model-name: "Qwen/Qwen3.8-Flash-Next"
host: "0.0.0.0"

# Official FP8 on eight GPUs requires tensor + expert parallelism (TEP8).
tensor-parallel-size: 8
enable-expert-parallel: true
moe-backend: triton

# Long-context production profile with bounded concurrent prefills.
max-model-len: 400000
max-num-seqs: 64
max-num-batched-tokens: 16384
max-num-partial-prefills: 4
max-long-partial-prefills: 1
long-prefill-token-threshold: 8192
gpu-memory-utilization: 0.93
kv-cache-dtype: auto

trust-remote-code: true
disable-custom-all-reduce: true
enable-chunked-prefill: true
enable-prefix-caching: true
no-enable-flashinfer-autotune: true

enable-auto-tool-choice: true
tool-call-parser: qwen3_xml
reasoning-parser: qwen3

mm-encoder-tp-mode: data
mm-processor-cache-type: shm
default-chat-template-kwargs: '{"reasoning_effort": "low"}'
hf-overrides: '{"text_config": {"rope_parameters": {"mrope_interleaved": true, "mrope_section": [11, 11, 10], "rope_type": "yarn", "rope_theta": 10000000, "partial_rotary_factor": 0.25, "factor": 1.6, "original_max_position_embeddings": 262144}}}'
speculative-config: '{"method":"mtp","num_speculative_tokens":2}'
